name: build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: tests
          annotate_only: true
          detailed_summary: true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: '**/target/surefire-reports/**'

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: jars
          path: '*/target/aquery*.jar'
          if-no-files-found: error

  publish-snapshot:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Read the version
        id: version
        run: |
          echo "value=$(mvn --batch-mode --quiet -DforceStdout \
            help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"

      - name: Deploy snapshot
        if: endsWith(steps.version.outputs.value, '-SNAPSHOT')
        run: mvn --batch-mode --no-transfer-progress -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
